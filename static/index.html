<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT 情报智能体</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 密码验证 -->
<div class="password-screen" id="password-screen">
  <div class="password-box">
    <div class="password-icon">🔒</div>
    <h2>OSINT 情报智能体</h2>
    <p>请输入访问密码</p>
    <input type="password" id="password-input" placeholder="密码" onkeypress="if(event.key==='Enter')checkPassword()">
    <button onclick="checkPassword()">登录</button>
    <div class="password-error" id="password-error"></div>
  </div>
</div>

<!-- 主应用 -->
<div class="header" id="main-app" style="display:none;">
  <div class="logo">🔍</div>
  <div>
    <h1>OSINT 情报智能体</h1>
    <div class="subtitle">Grok 4.20 + Maigret 1836 站点 + 15 游戏平台</div>
  </div>
  <div class="status">
    <span class="dot"></span>
    <span id="status-text">连接中...</span>
  </div>
</div>

<div class="chat-container" id="chat-mode" style="display:none;">
  <div class="welcome" id="welcome">
    <div class="icon">🕵️</div>
    <h2>OSINT 情报分析智能体</h2>
    <p>我是你的情报分析 Agent。用自然语言告诉我你想调查谁，我会自动搜索 1836 个平台、15 个游戏平台，并利用 Grok 实时搜索爬虫收集和提炼信息。</p>
    <div class="features">
      <div class="feature"><strong>1836</strong> Maigret 站点</div>
      <div class="feature"><strong>15</strong> 游戏平台</div>
      <div class="feature"><strong>Grok</strong> 实时搜索</div>
      <div class="feature"><strong>3</strong> 搜索引擎</div>
    </div>
    <div class="suggestions" style="justify-content:center;margin-top:20px;">
      <span class="suggestion" onclick="sendSuggestion('搜索 johnsmith')">🔍 搜索 johnsmith</span>
      <span class="suggestion" onclick="sendSuggestion('全站搜索 testuser')">📋 全站搜索</span>
      <span class="suggestion" onclick="sendSuggestion('搜索 gamer123 在游戏平台')">🎮 游戏平台</span>
      <span class="suggestion" onclick="sendSuggestion('深度分析 alex_dev')">🧠 深度分析</span>
    </div>
  </div>
</div>

<div class="input-area" id="input-area" style="display:none;">
  <!-- 功能选择工具栏 -->
  <div class="toolbar">
    <input type="text" id="target-input" class="target-input" placeholder="输入用户名（必填）" />
    <div class="mode-buttons">
      <button class="mode-btn active" data-mode="default" onclick="setMode(this)" title="Grok + 100 站点 + 15 游戏平台（并发）">⚡ 深度搜索</button>
      <button class="mode-btn" data-mode="full" onclick="setMode(this)" title="Grok + 1836 全站 + 15 游戏平台">📋 全站搜索</button>
      <button class="mode-btn" data-mode="game" onclick="setMode(this)" title="仅 15 游戏平台">🎮 游戏平台</button>
      <button class="mode-btn" data-mode="deep" onclick="setMode(this)" title="深度搜索 + AI 深度推理分析">🧠 深度分析</button>
    </div>
  </div>
  <div class="input-wrapper">
    <input type="text" id="input" placeholder="补充指令（可选），如：全站搜索、深度分析" onkeypress="if(event.key==='Enter')sendMessage()">
    <button id="send-btn" onclick="sendMessage()">发送</button>
  </div>
</div>

<!-- 模块化 JavaScript -->
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/chat.js"></script>
<script>
// 页面加载时检查认证
window.addEventListener('DOMContentLoaded', () => {
  checkAuth();
  initChat();
});
</script>
</body>
</html>
