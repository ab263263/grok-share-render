<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT 情报智能体 · 聊天模式</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
.header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 12px 20px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 18px; background: linear-gradient(90deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header .status { margin-left: auto; font-size: 12px; color: #888; }
.header .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4ade80; margin-right: 4px; }
.chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; word-wrap: break-word; }
.message.user { align-self: flex-end; background: linear-gradient(135deg, #4facfe, #00f2fe); color: #000; }
.message.ai { align-self: flex-start; background: #1e1e30; border: 1px solid #333; }
.message.ai pre { background: #0d1117; padding: 8px 12px; border-radius: 6px; margin: 8px 0; overflow-x: auto; font-size: 13px; }
.message.ai a { color: #4facfe; text-decoration: none; }
.message.ai a:hover { text-decoration: underline; }
.message.system { align-self: center; background: transparent; color: #666; font-size: 12px; text-align: center; }
.findings { margin-top: 8px; padding: 8px; background: #0d1117; border-radius: 6px; border-left: 3px solid #4facfe; }
.findings-title { font-size: 12px; color: #4facfe; margin-bottom: 4px; }
.finding-item { font-size: 13px; padding: 2px 0; }
.finding-item a { color: #4facfe; }
.input-area { padding: 16px 20px; background: #1a1a2e; border-top: 1px solid #333; display: flex; gap: 12px; }
.input-area input { flex: 1; padding: 12px 16px; background: #0d1117; border: 1px solid #333; border-radius: 8px; color: #e0e0e0; font-size: 14px; outline: none; }
.input-area input:focus { border-color: #4facfe; }
.input-area button { padding: 12px 24px; background: linear-gradient(135deg, #4facfe, #00f2fe); border: none; border-radius: 8px; color: #000; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
.input-area button:hover { opacity: 0.9; }
.input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
.typing { display: inline-block; width: 6px; height: 16px; background: #4facfe; animation: blink 1s infinite; margin-left: 4px; vertical-align: middle; }
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
.suggestions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.suggestion { padding: 4px 12px; background: #1e1e30; border: 1px solid #333; border-radius: 16px; font-size: 12px; color: #888; cursor: pointer; transition: all 0.2s; }
.suggestion:hover { border-color: #4facfe; color: #4facfe; }
</style>
</head>
<body>
<div class="header">
  <h1>OSINT 情报智能体</h1>
  <span style="font-size:12px;color:#666;">Grok 4.20 + Maigret 1836 站点</span>
  <div class="status"><span class="dot"></span><span id="status-text">就绪</span></div>
</div>
<div class="chat-container" id="chat">
  <div class="message ai">
    你好！我是 OSINT 情报分析智能体。输入用户名即可开始调查，例如：<br>
    <div class="suggestions">
      <span class="suggestion" onclick="sendSuggestion('搜索 darkyokail')">搜索 darkyokail</span>
      <span class="suggestion" onclick="sendSuggestion('查找 johnsmith')">查找 johnsmith</span>
      <span class="suggestion" onclick="sendSuggestion('@testuser')">搜索 @testuser</span>
    </div>
  </div>
</div>
<div class="input-area">
  <input type="text" id="input" placeholder="输入用户名或消息..." onkeypress="if(event.key==='Enter')sendMessage()">
  <button id="send-btn" onclick="sendMessage()">发送</button>
</div>
<script>
const API_BASE = window.location.origin;
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const statusText = document.getElementById('status-text');
let history = [];

function addMessage(content, type) {
  const div = document.createElement('div');
  div.className = 'message ' + type;
  if (type === 'ai') {
    div.innerHTML = formatMarkdown(content);
  } else {
    div.textContent = content;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function formatMarkdown(text) {
  if (!text) return '';
  // 转义 HTML
  text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // 代码块
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre>$2</pre>');
  // 行内代码
  text = text.replace(/`([^`]+)`/g, '<code style="background:#0d1117;padding:2px 6px;border-radius:3px;">$1</code>');
  // Markdown 链接
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // 引用链接 [[N]](url)
  text = text.replace(/\[\[(\d+)\]\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank">[$1]</a>');
  // 裸 URL
  text = text.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
  // 粗体
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // 换行
  text = text.replace(/\n/g, '<br>');
  return text;
}

function addFindings(findings) {
  if (!findings || findings.length === 0) return;
  const div = document.createElement('div');
  div.className = 'findings';
  div.innerHTML = `<div class="findings-title">情报发现 (${findings.length})</div>`;
  findings.slice(0, 15).forEach(f => {
    const item = document.createElement('div');
    item.className = 'finding-item';
    const url = f.url || '';
    const platform = f.platform || '?';
    const snippet = f.snippet ? ` → ${f.snippet.substring(0, 80)}` : '';
    item.innerHTML = `[${platform}] <a href="${url}" target="_blank">${url}</a>${snippet}`;
    div.appendChild(item);
  });
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function sendSuggestion(text) {
  input.value = text;
  sendMessage();
}

async function sendMessage() {
  const message = input.value.trim();
  if (!message) return;
  
  addMessage(message, 'user');
  input.value = '';
  sendBtn.disabled = true;
  statusText.textContent = '思考中...';
  
  // 添加打字指示器
  const typingDiv = addMessage('<span class="typing"></span> AI 正在分析...', 'ai');
  
  try {
    const response = await fetch(`${API_BASE}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: message,
        history: history.slice(-5)
      })
    });
    
    const data = await response.json();
    
    // 移除打字指示器
    typingDiv.remove();
    
    if (data.reply) {
      addMessage(data.reply, 'ai');
      history.push({ role: 'user', content: message });
      history.push({ role: 'assistant', content: data.reply });
    }
    
    // 显示情报结果
    if (data.osint_results) {
      const osint = data.osint_results;
      if (osint.error) {
        addMessage(`情报收集出错: ${osint.error}`, 'system');
      } else {
        // 显示 Grok 搜索发现的平台
        const grokPlatforms = osint.grok_search?.platforms || [];
        const maigretFound = osint.maigret_found || [];
        const allFindings = [
          ...grokPlatforms.map(p => ({ ...p, platform: p.platform || 'Grok搜索' })),
          ...maigretFound.map(f => ({ platform: f.platform, url: f.url, snippet: f.snippet }))
        ];
        if (allFindings.length > 0) {
          addFindings(allFindings);
        }
        // 显示个人信息
        const personalInfo = osint.grok_search?.personal_info || {};
        if (Object.keys(personalInfo).length > 0) {
          let infoText = '提取的个人信息:\n';
          for (const [key, value] of Object.entries(personalInfo)) {
            infoText += `- ${key}: ${value}\n`;
          }
          addMessage(infoText, 'ai');
        }
      }
    }
    
    statusText.textContent = '就绪';
  } catch (error) {
    typingDiv.remove();
    addMessage(`错误: ${error.message}`, 'system');
    statusText.textContent = '错误';
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

// 检查后端状态
fetch(`${API_BASE}/api/health`).then(r => r.json()).then(d => {
  if (d.status === 'ok') {
    statusText.textContent = `就绪 (${d.sites_loaded} 站点)`;
  }
}).catch(() => {
  statusText.textContent = '后端未连接';
});

input.focus();
</script>
</body>
</html>
