<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok 镜像站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.box{background:#1a1a1a;border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
h1{text-align:center;font-size:24px;margin-bottom:8px}
.desc{text-align:center;color:#888;font-size:14px;margin-bottom:24px}
.status{background:#111;border-radius:12px;padding:16px;margin-bottom:24px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{text-align:center}
.stat .num{font-size:22px;font-weight:700;color:#4a9}
.stat .lbl{font-size:12px;color:#888;margin-top:2px}
.models{background:#111;border-radius:12px;padding:12px 16px;margin-bottom:24px;font-size:13px;color:#aaa;line-height:1.8}
.models b{color:#4a9}
.g{margin-bottom:20px}
label{display:block;font-size:14px;color:#aaa;margin-bottom:8px}
input{width:100%;padding:14px 16px;border:1px solid #333;border-radius:10px;background:#0a0a0a;color:#fff;font-size:16px;outline:none;transition:border-color .2s}
input:focus{border-color:#4a9}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#fff;color:#000;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
button:hover{background:#e0e0e0;transform:translateY(-1px)}
button:disabled{background:#333;color:#666;cursor:not-allowed;transform:none}
.error{color:#ff4444;font-size:13px;text-align:center;margin-top:12px;display:none}
.footer{text-align:center;margin-top:16px;color:#555;font-size:12px}
</style>
</head>
<body>
<div class="box">
  <h1>Grok 镜像站</h1>
  <p class="desc">输入密码，自动轮询 3500+ 账号</p>

  <div class="status">
    <div class="stat"><div class="num" id="acnt">-</div><div class="lbl">可用账号</div></div>
    <div class="stat"><div class="num" id="quota">-</div><div class="lbl">剩余次数</div></div>
    <div class="stat"><div class="num" id="models">-</div><div class="lbl">可用模型</div></div>
    <div class="stat"><div class="num" id="feat">4</div><div class="lbl">功能</div></div>
  </div>

  <div class="models" id="modelList">加载中...</div>

  <form id="f">
    <div class="g">
      <label>访问密码</label>
      <input type="password" id="p" placeholder="请输入访问密码" autofocus>
    </div>
    <button type="submit" id="btn">进入镜像站</button>
    <div class="error" id="e"></div>
  </form>
  <div class="footer">聊天 / 生图 / 视频 / DeepSearch</div>
</div>

<script>
var TOKENS=[];
var PASSWORD='2632643526';
var BASE='https://grok-share-web.onrender.com';

// Load tokens
var s=document.createElement('script');s.src='tokens.js';s.onload=init;s.onerror=function(){init()};
document.head.appendChild(s);

function init(){
  document.getElementById('acnt').textContent=TOKENS.length||3504;

  // Try to fetch pool status from sign-in page or public API
  fetchStatus();
}

function fetchStatus(){
  // Try common public status endpoints
  fetch(BASE+'/api/v2/status.json').then(function(r){return r.json()}).then(function(d){
    if(d&&d.models){
      document.getElementById('models').textContent=d.models.length||'-';
      document.getElementById('modelList').innerHTML='<b>可用模型:</b> '+d.models.map(function(m){return m.title||m.id}).join(' / ');
    }
  }).catch(function(){});

  // Try to get pool info
  fetch(BASE+'/api/pool/info').then(function(r){return r.json()}).then(function(d){
    if(d&&d.pools){
      var total=0;
      d.pools.forEach(function(p){total+=p.remaining||0});
      document.getElementById('quota').textContent=total;
      document.getElementById('models').textContent=d.pools.length;
      var html='<b>账号池:</b><br>';
      d.pools.forEach(function(p){
        html+='&bull; '+p.models+': '+p.remaining+'/'+p.total+'<br>';
      });
      document.getElementById('modelList').innerHTML=html;
    }
  }).catch(function(){});

  // Fallback: show static info
  setTimeout(function(){
    if(document.getElementById('modelList').textContent==='加载中...'){
      document.getElementById('modelList').innerHTML='<b>可用模型:</b> grok-3 / grok-4 / grok-4-heavy / grok-420 / grok-4-mini-thinking';
      document.getElementById('models').textContent='5';
      document.getElementById('quota').textContent='100+';
    }
  }, 3000);
}

document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  var pwd=document.getElementById('p').value;
  var btn=document.getElementById('btn');
  var err=document.getElementById('e');
  if(pwd!==PASSWORD){err.style.display='block';err.textContent='密码错误';return}
  if(!TOKENS.length){err.style.display='block';err.textContent='Token 加载中，请稍后重试';return}
  err.style.display='none';
  btn.disabled=true;btn.textContent='正在连接...';
  var tk=TOKENS[Math.floor(Math.random()*TOKENS.length)];
  var fm=document.createElement('form');
  fm.method='POST';fm.action=BASE+'/sign-in';
  var i1=document.createElement('input');i1.type='hidden';i1.name='usertoken';i1.value=tk;fm.appendChild(i1);
  var i2=document.createElement('input');i2.type='hidden';i2.name='action';i2.value='default';fm.appendChild(i2);
  document.body.appendChild(fm);fm.submit();
});
</script>
</body>
</html>
