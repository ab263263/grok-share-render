<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok 镜像站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.box{background:#1a1a1a;border-radius:16px;padding:40px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
h1{text-align:center;font-size:24px;margin-bottom:8px}.desc{text-align:center;color:#888;font-size:14px;margin-bottom:24px}.models{margin-bottom:24px}.models h3{font-size:14px;color:#aaa;margin-bottom:12px}.model-btn{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#111;border:1px solid #333;border-radius:10px;margin-bottom:8px;transition:all .2s}.model-btn:hover{border-color:#4a9;background:#151515}.model-name{font-weight:600;font-size:14px}.model-tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}.tag-fast{background:#1a3a2a;color:#4a9}.tag-pro{background:#3a2a1a;color:#f90}.tag-heavy{background:#3a1a1a;color:#f55}.model-quota{font-size:12px;color:#888}.g{margin-bottom:20px}label{display:block;font-size:14px;color:#aaa;margin-bottom:8px}input{width:100%;padding:14px 16px;border:1px solid #333;border-radius:10px;background:#0a0a0a;color:#fff;font-size:16px;outline:none;transition:border-color .2s}input:focus{border-color:#4a9}button.submit{width:100%;padding:14px;border:none;border-radius:10px;background:#fff;color:#000;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}button.submit:hover{background:#e0e0e0;transform:translateY(-1px)}button.submit:disabled{background:#333;color:#666;cursor:not-allowed;transform:none}.error{color:#ff6666;font-size:13px;text-align:center;margin-top:12px;display:none;line-height:1.5}.hint{color:#777;font-size:12px;line-height:1.6;margin-top:12px;text-align:center}.footer{text-align:center;margin-top:16px;color:#555;font-size:12px}.ad{margin:-8px 0 18px;padding:10px 12px;border:1px solid #2f6f4f;border-radius:10px;background:#0f241a;color:#7dffb2;text-align:center;font-size:13px;font-weight:600;line-height:1.5;box-shadow:0 0 24px rgba(74,170,153,.12)}
</style>
</head>
<body>
<div class="box">
  <h1>Grok 镜像站</h1>
  <p class="desc">账号池后端托管 · 前端不暴露 Token</p>
  <div class="ad">公益token群175877552<br>希望人人tokne自由</div>
  <div class="models">
    <h3>可用模型</h3>
    <div class="model-btn"><div><span class="model-name">Grok 3</span> <span class="model-tag tag-fast">Fast</span></div><span class="model-quota">账号池轮询</span></div>
    <div class="model-btn"><div><span class="model-name">Grok 4</span> <span class="model-tag tag-pro">Expert</span></div><span class="model-quota">账号池轮询</span></div>
    <div class="model-btn"><div><span class="model-name">Grok 420</span> <span class="model-tag tag-pro">Thinking</span></div><span class="model-quota">账号池轮询</span></div>
    <div class="model-btn"><div><span class="model-name">Grok 4 Heavy</span> <span class="model-tag tag-heavy">Heavy</span></div><span class="model-quota">账号池轮询</span></div>
    <div class="model-btn"><div><span class="model-name">Mini Companion</span> <span class="model-tag tag-fast">Fast</span></div><span class="model-quota">账号池轮询</span></div>
  </div>
  <form id="f">
    <div class="g">
      <label>访问密码</label>
      <input type="password" id="p" placeholder="请输入访问密码" autofocus autocomplete="current-password">
    </div>
    <button type="submit" class="submit" id="btn">进入镜像站</button>
    <div class="error" id="e"></div>
  </form>
  <div class="hint">安全版登录页只接收启动时注入的单个登录令牌，不再暴露全量账号池。</div>
  <div class="footer">聊天 / 生图 / 视频 / DeepSearch</div>
</div>
<script>
window.__GROK_LOGIN_TOKEN__ = '';
window.__GROK_LOGIN_TOKEN_READY__ = false;
window.__GROK_LOGIN_TOKEN_ERROR__ = 'missing';
</script>
<script src="/token.js"></script>
<script>
(function(){
  var PASSWORD = '2632643526';
  var form = document.getElementById('f');
  var input = document.getElementById('p');
  var btn = document.getElementById('btn');
  var err = document.getElementById('e');

  function showError(message) {
    err.style.display = 'block';
    err.textContent = message;
  }

  form.addEventListener('submit', function(ev) {
    ev.preventDefault();
    if (input.value !== PASSWORD) {
      showError('密码错误');
      return;
    }
    var token = window.__GROK_LOGIN_TOKEN__ || '';
    if (!token) {
      var reason = window.__GROK_LOGIN_TOKEN_ERROR__ || 'missing';
      showError(reason === 'missing' ? '账号池未就绪，请稍后刷新重试。' : '登录令牌加载失败，请检查部署日志。');
      return;
    }
    btn.disabled = true;
    btn.textContent = '正在连接...';
    var form = document.createElement('form');
    form.method = 'POST';
    form.action = '/sign-in';
    var tokenInput = document.createElement('input');
    tokenInput.type = 'hidden';
    tokenInput.name = 'usertoken';
    tokenInput.value = token;
    form.appendChild(tokenInput);
    var actionInput = document.createElement('input');
    actionInput.type = 'hidden';
    actionInput.name = 'action';
    actionInput.value = 'default';
    form.appendChild(actionInput);
    document.body.appendChild(form);
    form.submit();
  });
})();
</script>
</body>
</html>
