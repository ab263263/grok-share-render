<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.box{background:#1a1a1a;border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
h1{text-align:center;font-size:24px;margin-bottom:8px}

.models{background:#111;border-radius:12px;padding:12px 16px;margin-bottom:24px;font-size:13px;color:#aaa;line-height:1.8}
.models b{color:#4a9}
.g{margin-bottom:20px}
label{display:block;font-size:14px;color:#aaa;margin-bottom:8px}
input{width:100%;padding:14px 16px;border:1px solid #333;border-radius:10px;background:#0a0a0a;color:#fff;font-size:16px;outline:none;transition:border-color .2s}
input:focus{border-color:#4a9}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#fff;color:#000;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
button:hover{background:#e0e0e0;transform:translateY(-1px)}
button:disabled{background:#333;color:#666;cursor:not-allowed;transform:none}
.error{color:#ff4444;font-size:13px;text-align:center;margin-top:12px;display:none}
.footer{text-align:center;margin-top:16px;color:#555;font-size:12px}
</style>
