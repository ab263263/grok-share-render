<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok 镜像站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#1a1a1a;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
h1{text-align:center;font-size:24px;margin-bottom:8px}
.desc{text-align:center;color:#888;font-size:14px;margin-bottom:32px}
.g{margin-bottom:20px}
label{display:block;font-size:14px;color:#aaa;margin-bottom:8px}
input{width:100%;padding:14px 16px;border:1px solid #333;border-radius:10px;background:#111;color:#fff;font-size:16px;outline:none;transition:border-color .2s}
input:focus{border-color:#666}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#fff;color:#000;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
button:hover{background:#e0e0e0;transform:translateY(-1px)}
.error{color:#ff4444;font-size:13px;text-align:center;margin-top:12px;display:none}
.footer{text-align:center;margin-top:20px;color:#555;font-size:12px}
</style>
</head>
<body>
<div class="box">
  <h1>Grok 镜像站</h1>
  <p class="desc">输入密码即可使用，3500+ 账号自动轮询</p>
  <form id="f">
    <div class="g">
      <label>访问密码</label>
      <input type="password" id="p" placeholder="请输入访问密码" autofocus>
    </div>
    <button type="submit" id="b">进入镜像站</button>
    <div class="error" id="e">密码错误</div>
  </form>
  <div class="footer">Powered by grok-share-server</div>
</div>
<script src="tokens.js"></script>
<script>
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  var pwd=document.getElementById('p').value;
  var btn=document.getElementById('b');
  var err=document.getElementById('e');
  if(pwd!=='2632643526'){err.style.display='block';err.textContent='密码错误';return}
  err.style.display='none';
  btn.disabled=true;btn.textContent='正在连接...';
  var tk=TOKENS[Math.floor(Math.random()*TOKENS.length)];
  var fm=document.createElement('form');
  fm.method='POST';fm.action='/sign-in';
  var i1=document.createElement('input');i1.type='hidden';i1.name='usertoken';i1.value=tk;fm.appendChild(i1);
  var i2=document.createElement('input');i2.type='hidden';i2.name='action';i2.value='default';fm.appendChild(i2);
  document.body.appendChild(fm);fm.submit();
});
</script>
</body>
</html>
