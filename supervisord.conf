[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mysql]
command=/usr/sbin/mysqld --user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/mysql.log
stderr_logfile=/var/log/mysql_err.log
priority=10

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf --daemonize no
autostart=true
autorestart=true
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis_err.log
priority=20

[program:init-db]
command=/init-db.sh
autostart=true
autorestart=false
stdout_logfile=/var/log/init-db.log
stderr_logfile=/var/log/init-db_err.log
priority=25
startsecs=0

[program:grok-app]
command=/bin/bash -c "sleep 20 && cd /app && ./main"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/grok-app.log
stderr_logfile=/var/log/grok-app_err.log
priority=30
