[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/var/run/supervisord.pid

[program:mysql]
command=/bin/sh -c 'MYSQLD=$(command -v mariadbd || command -v mysqld); exec "$MYSQLD" --user=root --datadir=/var/lib/mysql'
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

[program:redis]
command=/bin/sh -c 'REDIS=$(command -v redis-server); exec "$REDIS" /etc/redis.conf --daemonize no'
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20

[program:init-db]
command=/init-db.sh
autostart=true
autorestart=false
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=25
startsecs=0

[program:grok-app]
command=/bin/bash -c "sleep 20 && cd /app && ./main"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=30
